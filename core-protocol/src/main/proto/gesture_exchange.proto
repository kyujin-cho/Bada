//
// Wire-compatible subset of the Google Play services Gesture Exchange
// messages used by SuperDrop's public-app Tap to Share path.
syntax = "proto2";

package gestureexchange;

option optimize_for = LITE_RUNTIME;
option java_package = "dev.bluehouse.bada.protocol.gestureexchange.proto";
option java_multiple_files = true;

enum GestureExchangeFeature {
  GESTURE_EXCHANGE_FEATURE_UNSPECIFIED = 0;
  CONTACT_EXCHANGE = 1;
  SYSTEM_SHARE_SHEET = 2;
  APP_EXPERIENCE = 3;
}

enum HandoverResultStatus {
  HANDOVER_RESULT_STATUS_UNSPECIFIED = 0;
  MESSAGE = 1;
  COMPLETED = 2;
  FAILURE = 3;
  INITIAL = 4;
}

message ManufacturerInfo {
  optional string manufacturer = 1;
}

message ApplicationLabelRequest {
  optional GestureExchangeFeature current_feature = 1;
  optional ManufacturerInfo manufacturer_info = 2;
}

message ApplicationLabelResponse {
  optional GestureExchangeFeature selected_feature = 1;
  optional ManufacturerInfo manufacturer_info = 2;
}

message HandoverResult {
  optional HandoverResultStatus status = 1;
  optional bytes payload = 2;
  optional int32 error_code = 3;
}

message ConnectionHandoverRequest {
  optional HandoverResult handover_result = 1;
}

message ConnectionHandoverResponse {
  optional HandoverResult handover_result = 1;
}

message AvailableChannels { repeated int32 channels = 1 [packed = true]; }
message WifiDirectClientUsableChannels { repeated int32 channels = 1 [packed = true]; }
message WifiLanUsableChannels { repeated int32 channels = 1 [packed = true]; }
message WifiAwareUsableChannels { repeated int32 channels = 1 [packed = true]; }
message WifiHotspotStaUsableChannels { repeated int32 channels = 1 [packed = true]; }

// The selected GMS artifact exposes eight role flags but no stable public
// names. Preserve their exact field numbers without inventing semantics.
message MediumRole {
  optional bool role_flag_1 = 1;
  optional bool role_flag_2 = 2;
  optional bool role_flag_3 = 3;
  optional bool role_flag_4 = 4;
  optional bool role_flag_5 = 5;
  optional bool role_flag_6 = 6;
  optional bool role_flag_7 = 7;
  optional bool role_flag_8 = 8;
}

enum WifiDirectAuthType {
  WIFI_DIRECT_TYPE_UNKNOWN = 0;
  WIFI_DIRECT_WITH_PASSWORD = 1;
  WIFI_DIRECT_WITH_PIN = 2 [deprecated = true];
  WIFI_DIRECT_WITH_DEVICE_NAME = 3;
}

message ConnectivityCapabilityMetadata {
  optional bool supports_5_ghz = 1;
  optional string bssid = 2;
  optional bytes ip_address = 3;
  optional bool supports_6_ghz = 4;
  optional bool has_mobile_radio = 5;
  optional int32 ap_frequency = 6 [default = -1];
  optional AvailableChannels available_channels = 7;
  optional WifiDirectClientUsableChannels wifi_direct_client_usable_channels = 8;
  optional WifiLanUsableChannels wifi_lan_usable_channels = 9;
  optional WifiAwareUsableChannels wifi_aware_usable_channels = 10;
  optional WifiHotspotStaUsableChannels wifi_hotspot_sta_usable_channels = 11;
  optional MediumRole medium_role = 12;
  repeated WifiDirectAuthType wifi_direct_auth_types = 13 [packed = true];
}

message ServiceData {
  optional string service_id = 1;
  optional string endpoint_id = 2;
  optional string zero_party_identifier = 3;
}

message ConnectivityCapability {
  optional ConnectivityCapabilityMetadata metadata = 1;
  repeated ServiceData service_data = 2;
  optional bytes channel_binding_token = 3;
}

message WifiDirectCredentials {
  optional string ssid = 1;
  optional string password = 2;
  optional int32 port = 3;
  optional int32 frequency_mhz = 4;
  optional string group_owner_ipv4 = 5 [default = "0.0.0.0"];
  optional bytes group_owner_ipv6 = 6;
  optional string device_address = 7;
  optional string extra = 8;
  optional string interface_address = 9;
}

message EndpointConnectivityEntry {
  optional WifiDirectCredentials wifi_direct = 1;
  optional string service_id = 2;
  optional string endpoint_id = 3;
  optional bytes endpoint_info = 4;
  optional string zero_party_identifier = 5;
  optional ConnectivityCapabilityMetadata metadata = 6;
}

message ConnectivityInfo {
  repeated EndpointConnectivityEntry entries = 1;
  optional bytes channel_binding_token = 2;
  optional bytes bluetooth_mac = 3;
}

message GestureConfirmedInfo {
  optional string endpoint_id = 1;
  optional bool is_initiator = 2;
  optional bytes bluetooth_mac = 3;
  optional GestureExchangeFeature selected_feature = 4;
  optional bool both_devices_samsung = 5;
  optional int32 aid_type = 6;
}
