[versions]
# Toolchain
kotlin = "2.1.0"
agp = "8.7.3"
ksp = "2.1.0-1.0.29"

# Android SDK levels
compileSdk = "36"
minSdk = "24"
targetSdk = "36"

# AndroidX
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxFragment = "1.8.5"
# Spring physics for the landscape nav pill's elastic drag-follow.
androidxDynamicAnimation = "1.0.0"

# Material Components for Android — ships BottomNavigationView and the
# MaterialComponents themes that BottomNavigationView's styles inherit
# from. Pulled in by :app for the in-app bottom navigation between the
# send/receive tab and the settings tab.
material = "1.12.0"

# WorkManager — reboot-surviving periodic scheduler for the automatic update
# check (UpdateCheckWorker polls GitHub Releases every 6h). Chosen over
# AlarmManager+BootReceiver because WorkManager re-enqueues persisted
# PeriodicWork after a reboot with ZERO user action. 2.9.1 is the current
# stable line compatible with minSdk 24 / coroutines 1.9.0.
androidxWork = "2.9.1"

# Coroutines
kotlinxCoroutines = "1.9.0"

# Protobuf (used from L1 onwards; declared here so :core-protocol is ready)
protobuf = "4.28.3"
# protobuf-gradle-plugin: drives `protoc` codegen during the Gradle build.
# Versioned independently from the protobuf runtime above.
protobufPlugin = "0.9.5"

# Crypto (optional helper for HKDF; wired up from L1)
tink = "1.15.0"

# ZXing (used by :app to render the Quick Share QR-code URL as a scannable
# bitmap on the sender's screen, see #84). 3.5.3 is the current stable
# release of the pure-Java `core` artifact; the Android-flavoured
# `zxing-android-embedded` is intentionally NOT pulled in because we only
# need the encoder side (BitMatrix → Bitmap conversion is trivial).
zxingCore = "3.5.3"

# Radio-helper companion module (#234). The self-ADB Wi-Fi stack
# (libadb-android + Conscrypt + BouncyCastle) and Shizuku live ONLY in
# :radio-helper, which targets API 28 to keep the legacy radio-toggle
# capability. bcprovJdk and bcpkixJdk share one version so the BouncyCastle
# provider/PKIX pair stay aligned.
shizuku = "13.1.5"
libadb = "3.1.1"
conscrypt = "2.5.2"
bouncycastle = "1.81"

# Testing
junit4 = "4.13.2"
junitJupiter = "5.11.3"
truth = "1.4.4"
androidxJunit = "1.2.1"
androidxEspresso = "3.6.1"
androidxTestRunner = "1.6.2"
robolectric = "4.16.1"
robolectricAndroidAll = "15-robolectric-12650502"

# Static analysis
ktlintPlugin = "12.1.2"
detekt = "1.23.7"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidxDynamicAnimation" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# `lifecycle-process` exposes [androidx.lifecycle.ProcessLifecycleOwner],
# the singleton LifecycleOwner that tracks "is any activity of this app
# foreground". The receiver foreground service uses it (#35) to switch
# the BLE scan mode between BALANCED (background) and LOW_LATENCY
# (foreground) without inventing a separate process-state mechanism.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }

# WorkManager (Kotlin/coroutines flavour) — drives the periodic GitHub update
# check (UpdateCheckWorker) scheduled from BadaApplication.onCreate.
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# Kotlin coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Protobuf
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }

# Tink (HKDF helper)
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# ZXing core — pure-Java QR encoder/decoder. Used by :app to render the
# Quick Share QR URL as a scannable bitmap (#84). Pure JVM (no Android
# imports) so the BitMatrix-producer half of the rendering pipeline is
# unit-testable on a host JVM; only the BitMatrix → Bitmap adapter
# touches Android types.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }

# Radio-helper companion module (#234)
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }

# Testing
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all", version.ref = "robolectricAndroidAll" }

# Detekt formatting plugin (loadable into detekt's plugin classpath)
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
